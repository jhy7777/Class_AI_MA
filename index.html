<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jhy | Profile</title>
    <style>
        /* 디자인 시스템: 하늘색 & 화이트 테마 */
        :root {
            --sky-blue: #87CEEB; /* 밝고 깨끗한 하늘색 */
            --dark-sky: #00BFFF; /* 강조용 딥 스카이 블루 */
            --white: #ffffff;
            --light-gray: #f8f9fa;
            --text-main: #333333;
            --text-sub: #666666;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            background-color: var(--light-gray);
            color: var(--text-main);
            line-height: 1.6;
        }

        /* 상단 소개 영역 (Sky Blue Hero Section) */
        header {
            background-color: var(--sky-blue);
            color: var(--white);
            padding: 80px 20px;
            text-align: center;
        }

        .hero-icon {
            font-size: 50px;
            margin-bottom: 15px;
            display: block;
        }

        header h1 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 5px;
        }

        header .greeting {
            font-size: 1.2rem;
            font-weight: 300;
            opacity: 0.9;
        }

        /* 본문 영역 (White Content Section) */
        main {
            max-width: 550px;
            margin: -40px auto 60px;
            padding: 0 20px;
        }

        .content-card {
            background: var(--white);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .section {
            margin-bottom: 40px;
        }

        .section:last-child {
            margin-bottom: 0;
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--dark-sky);
            margin-bottom: 20px;
            border-bottom: 2px solid var(--light-gray);
            padding-bottom: 8px;
        }

        /* 리스트 및 링크 스타일 */
        .item-list {
            list-style: none;
        }

        .item-group {
            margin-bottom: 18px;
        }

        .item-main {
            display: flex;
            align-items: center;
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-main);
        }

        .item-icon {
            margin-right: 12px;
            font-size: 1.2rem;
        }

        .link-text {
            display: block;
            font-size: 0.85rem;
            color: var(--dark-sky);
            text-decoration: none;
            margin-left: 34px; /* 아이콘 너비만큼 들여쓰기 */
            transition: opacity 0.2s;
        }

        .link-text:hover {
            text-decoration: underline;
            opacity: 0.7;
        }

        /* 목표 강조 */
        .goal-box {
            background-color: #f0f8ff;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            font-weight: 700;
            color: var(--dark-sky);
            border: 1px solid var(--sky-blue);
        }

        /* 하단 명함 스타일 카드 */
        .business-card {
            max-width: 350px;
            margin: 0 auto;
            background: var(--white);
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .card-name {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 5px;
        }

        .card-interest {
            font-size: 0.9rem;
            color: var(--text-sub);
            letter-spacing: 1px;
        }

        /* 반응형 */
        @media (max-width: 480px) {
            header h1 { font-size: 2.5rem; }
            .content-card { padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <header>
        <span class="hero-icon">☁️</span>
        <h1>jhy</h1>
        <p class="greeting">안녕하세요, jhy 입니다.</p>
    </header>

    <main>
        <div class="content-card">
            <!-- 관심 분야 -->
            <section class="section">
                <h2 class="section-title">관심 분야</h2>
                <ul class="item-list">
                    <li class="item-group"><span class="item-main"><span class="item-icon">🧾</span> 세무·재무·회계</span></li>
                </ul>
            </section>

            <!-- 좋아하는 것 (정확한 링크 반영) -->
            <section class="section">
                <h2 class="section-title">좋아하는 것</h2>
                <ul class="item-list">
                    <li class="item-group">
                        <span class="item-main"><span class="item-icon">🧱</span> 레고</span>
                        <a href="https://www.lego.com" target="_blank" class="link-text">공식 홈페이지 바로가기</a>
                    </li>
                    <li class="item-group">
                        <span class="item-main"><span class="item-icon">💜</span> 방탄소년단</span>
                        <a href="https://youtube.com/@bts?si=uc52pQFODRYNSn4j" target="_blank" class="link-text">공식 유튜브 바로가기</a>
                    </li>
                    <li class="item-group">
                        <span class="item-main"><span class="item-icon">📱</span> 삼성</span>
                        <a href="https://www.samsung.com" target="_blank" class="link-text">samsung.com 바로가기</a>
                    </li>
                </ul>
            </section>

            <!-- 목표 -->
            <section class="section">
                <h2 class="section-title">나의 목표</h2>
                <div class="goal-box">
                    "세무직 공무원 시험 합격"
                </div>
            </section>
        </div>
    </main>

    <!-- 하단 명함 카드 -->
    <footer style="padding-bottom: 50px;">
        <div class="business-card">
            <div class="card-name">jhy</div>
            <div class="card-interest">세무 · 재무 · 회계</div>
        </div>
    </footer>

</body>
</html>
